name: Android CI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: ["phase2/**", "phase3/**"]
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: |
          cargo install cargo-ndk --locked
      - name: Build Rust libraries and generate Kotlin bindings
        run: bash scripts/build-android-native.sh
      - name: Upload native bridge outputs
        uses: actions/upload-artifact@v4
        with:
          name: android-native-bridge
          path: |
            android/src/main/java
            android/src/main/jniLibs
          if-no-files-found: error
      - name: Run Android unit tests
        run: gradle :android:testDebugUnitTest
      - name: Assemble debug application
        run: gradle :android:assembleDebug
      - name: Upload debug APK for physical-device testing
        uses: actions/upload-artifact@v4
        with:
          name: tomos-transfer-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error
      - name: Run Android instrumentation tests on emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted Linux runners may not expose KVM. The current Android
          # emulator exits immediately with "-accel off" unless TCG is opted in.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: |
            set +e
            DIAG_DIR="$GITHUB_WORKSPACE/android-ci-diagnostics"
            mkdir -p "$DIAG_DIR"

            # Stream logcat while tests run; this preserves fatal process and
            # instrumentation crash messages even if the test runner exits early.
            adb logcat -c
            adb logcat -b all -v threadtime > "$DIAG_DIR/logcat.txt" 2>&1 &
            LOGCAT_PID=$!

            gradle :android:connectedDebugAndroidTest --info
            test_status=$?

            kill "$LOGCAT_PID" 2>/dev/null || true
            wait "$LOGCAT_PID" 2>/dev/null || true
            adb shell dumpsys activity instrumentation > "$DIAG_DIR/instrumentation-state.txt" 2>&1 || true
            adb shell pm list instrumentation > "$DIAG_DIR/instrumentations.txt" 2>&1 || true
            adb shell dumpsys package org.tomos.transfer.test > "$DIAG_DIR/test-package.txt" 2>&1 || true
            adb shell getprop > "$DIAG_DIR/device-properties.txt" 2>&1 || true
            exit "$test_status"
      - name: Upload Android instrumentation diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumentation-diagnostics
          path: android-ci-diagnostics/
          if-no-files-found: warn
