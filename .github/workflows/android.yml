name: Android CI

on:
  push:
    branches: ["phase2/**", "phase3/**"]
  pull_request:
    paths:
      - "android/**"
      - "crates/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "*.gradle.kts"
      - "settings.gradle.kts"
      - ".github/workflows/android.yml"

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Install native build tools
        run: |
          cargo install cargo-ndk --locked
      - name: Build Rust libraries and generate Kotlin bindings
        run: bash scripts/build-android-native.sh
      - name: Assemble debug application
        run: gradle :android:assembleDebug
